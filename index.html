<!DOCTYPE html>
<html>
<head>
  <title>SEAG Solar Battery Monitor</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 { margin-bottom: 10px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    canvas {
      background: white;
      border-radius: 10px;
    }

    /* BATTERY */
    .battery {
      width: 120px;
      height: 50px;
      border: 3px solid white;
      border-radius: 6px;
      position: relative;
      margin: 10px auto;
      display: flex;
      overflow: hidden;
    }

    .battery::after {
      content: "";
      width: 10px;
      height: 20px;
      background: white;
      position: absolute;
      right: -12px;
      top: 15px;
      border-radius: 2px;
    }

    .bar {
      flex: 1;
      border-right: 1px solid #0f172a;
    }

    .active { background: limegreen; }
    .low { background: red !important; }
  </style>
</head>

<body>

<h1>SEAG Solar Battery Monitor</h1>

<!-- BATTERY -->
<div class="card">
  <h2>Battery Status</h2>

  <div class="battery">
    <div class="bar" id="b1"></div>
    <div class="bar" id="b2"></div>
    <div class="bar" id="b3"></div>
    <div class="bar" id="b4"></div>
  </div>

  <h3 id="batteryText">0%</h3>
</div>

<div class="grid">

  <div class="card">
    <h3>Battery Voltage</h3>
    <canvas id="voltageChart"></canvas>
  </div>

  <div class="card">
    <h3>LDR Intensity</h3>
    <canvas id="ldrChart"></canvas>
  </div>

  <div class="card">
    <h3>MQTT Test Signal</h3>
    <h2 id="testValue">0</h2>
    <canvas id="testChart"></canvas>
  </div>

</div>

<script>

/* ================= MQTT ================= */
const client = mqtt.connect(
  "wss://72f0c3a517c845b8ac520b8aa04e7dd4.s1.eu.hivemq.cloud:8884/mqtt",
  {
    username: "ESP32_solar",
    password: "123Esp32"
  }
);

/* ================= DATA ================= */
let labels = [];
let voltageData = [];
let ldrLeftData = [];
let ldrRightData = [];
let testData = [];

/* ================= CHARTS ================= */
const voltageChart = new Chart(document.getElementById("voltageChart"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Battery Voltage",
      data: voltageData,
      borderColor: "lime",
      fill: false
    }]
  }
});

const ldrChart = new Chart(document.getElementById("ldrChart"), {
  type: "line",
  data: {
    labels,
    datasets: [
      { label: "LDR Left", data: ldrLeftData, borderColor: "yellow", fill: false },
      { label: "LDR Right", data: ldrRightData, borderColor: "cyan", fill: false }
    ]
  }
});

const testChart = new Chart(document.getElementById("testChart"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Test Signal",
      data: testData,
      borderColor: "orange",
      fill: false
    }]
  }
});

/* ================= BATTERY UI ================= */
function updateBattery(percent) {

  document.getElementById("batteryText").innerText = percent + "%";

  let bars = [
    document.getElementById("b1"),
    document.getElementById("b2"),
    document.getElementById("b3"),
    document.getElementById("b4")
  ];

  let active = Math.round(percent / 25);

  bars.forEach((b, i) => {
    b.classList.remove("active", "low");

    if (i < active) {
      b.classList.add("active");

      if (percent < 25 && i === 0) {
        b.classList.add("low");
      }
    }
  });
}

/* ================= MQTT ================= */
client.on("connect", () => {
  client.subscribe("solar/battery");
  client.subscribe("solar/ldr_left");
  client.subscribe("solar/ldr_right");
  client.subscribe("solar/test");
});

let last = { v: 0, l: 0, r: 0, t: 0 };

client.on("message", (topic, msg) => {

  const value = parseFloat(msg.toString());
  const time = new Date().toLocaleTimeString();

  if (topic === "solar/battery") {

    last.v = value;

    let percent = ((value - 11.0) / (12.6 - 11.0)) * 100;
    percent = Math.min(100, Math.max(0, percent));

    updateBattery(Math.round(percent));

  }

  if (topic === "solar/ldr_left") last.l = value;
  if (topic === "solar/ldr_right") last.r = value;

  if (topic === "solar/test") {
    last.t = value;
    document.getElementById("testValue").innerText = value;
  }

  labels.push(time);
  voltageData.push(last.v);
  ldrLeftData.push(last.l);
  ldrRightData.push(last.r);
  testData.push(last.t);

  if (labels.length > 20) {
    labels.shift();
    voltageData.shift();
    ldrLeftData.shift();
    ldrRightData.shift();
    testData.shift();
  }

  voltageChart.update();
  ldrChart.update();
  testChart.update();
});

</script>

</body>
</html>
