<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEAG Solar Battery Monitor</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    .status {
      margin: 10px;
      color: lightgreen;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 10px;
      border-radius: 12px;
      display: inline-block;
      width: 200px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>☀️ SEAG Solar Battery Monitor</h1>

<div class="status" id="status">Connecting...</div>

<div class="card">
  <h3>Voltage</h3>
  <div id="voltage" class="value">--</div>
</div>

<div class="card">
  <h3>Current</h3>
  <div id="current" class="value">--</div>
</div>

<div class="card">
  <h3>Power</h3>
  <div id="power" class="value">--</div>
</div>

<div class="card">
  <h3>Temperature</h3>
  <div id="temperature" class="value">--</div>
</div>

<script>
  const client = mqtt.connect(
    "wss://72f0c3a517c845b8ac520b8aa04e7dd4.s1.eu.hivemq.cloud:8884/mqtt",
    {
      username: "ESP32_solar",
      password: "123Esp32",
      reconnectPeriod: 2000
    }
  );

  const status = document.getElementById("status");

  client.on("connect", () => {
    status.innerText = "Connected ✔";

    client.subscribe("solar/voltage");
    client.subscribe("solar/current");
    client.subscribe("solar/power");
    client.subscribe("solar/temperature");
  });

  client.on("message", (topic, message) => {
    const value = message.toString();

    if (topic === "solar/voltage") {
      document.getElementById("voltage").innerText = value + " V";
    }

    if (topic === "solar/current") {
      document.getElementById("current").innerText = value + " A";
    }

    if (topic === "solar/power") {
      document.getElementById("power").innerText = value + " W";
    }

    if (topic === "solar/temperature") {
      document.getElementById("temperature").innerText = value + " °C";
    }
  });

  client.on("error", () => {
    status.innerText = "Connection Error ❌";
  });

  client.on("reconnect", () => {
    status.innerText = "Reconnecting...";
  });
</script>

</body>
</html>
